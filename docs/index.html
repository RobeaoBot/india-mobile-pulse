<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Mobile Pulse - 印度手机圈热点</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; }
        .header h1 { font-size: 2.5em; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .header p { color: #a0a0a0; font-size: 1.1em; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 25px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .stat-value { font-size: 2.5em; font-weight: bold; color: #667eea; }
        .stat-label { color: #a0a0a0; margin-top: 5px; }
        .section { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .section-title { font-size: 1.3em; margin-bottom: 15px; color: #667eea; }
        .brand-bar { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .brand-name { width: 100px; font-size: 0.9em; }
        .brand-bar-bg { flex: 1; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .brand-bar-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 10px; }
        .brand-count { width: 40px; text-align: right; color: #a0a0a0; }
        .post-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; margin-bottom: 10px; border-left: 3px solid #667eea; }
        .post-title { font-size: 1em; margin-bottom: 8px; }
        .post-meta { display: flex; gap: 10px; font-size: 0.85em; color: #a0a0a0; flex-wrap: wrap; }
        .source-badge { padding: 2px 8px; border-radius: 5px; font-size: 0.75em; font-weight: bold; }
        .source-reddit { background: #ff4500; } .source-youtube { background: #ff0000; } .source-news { background: #4285f4; } .source-official { background: #34a853; }
        .tag { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px; font-size: 0.8em; margin: 2px; }
        .loading { text-align: center; padding: 50px; color: #a0a0a0; }
        .error { background: rgba(248,113,113,0.2); border: 1px solid #f87171; border-radius: 10px; padding: 20px; text-align: center; color: #f87171; }
        .refresh-info { text-align: center; padding: 15px; background: rgba(102,126,234,0.1); border-radius: 10px; margin-bottom: 20px; font-size: 0.9em; color: #a0a0a0; }
        .refresh-info span { color: #667eea; font-weight: bold; }
        .footer { text-align: center; padding: 20px; color: #666; }
        .run-item { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px; }
        .sentiment-positive { color: #4ade80; } .sentiment-negative { color: #f87171; } .sentiment-neutral { color: #a0a0a0; }
        @media(max-width:768px){.header h1{font-size:1.8em}.stat-value{font-size:2em}.stats-grid{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📡 India Mobile Pulse</h1>
            <p>印度手机圈热点监测 | Indian Mobile Market Pulse Monitor</p>
        </div>
        <div class="refresh-info">🔄 页面将在 <span id="countdown">60</span> 秒后自动刷新 | 数据来源: HuggingFace Spaces | <button onclick="location.reload()" style="background:#667eea;color:#fff;border:none;padding:5px 15px;border-radius:5px;cursor:pointer;margin-left:10px">立即刷新</button></div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="statTotal">--</div><div class="stat-label">📊 总帖子数</div></div>
            <div class="stat-card"><div class="stat-value" id="statToday">--</div><div class="stat-label">📅 今日新增</div></div>
            <div class="stat-card"><div class="stat-value" id="statBrands">--</div><div class="stat-label">🏷️ 涉及品牌</div></div>
            <div class="stat-card"><div class="stat-value" id="statSentiment">--</div><div class="stat-label">😊 整体情感</div></div>
        </div>
        <div class="section"><div class="section-title">🏷️ 品牌声量排行</div><div id="brandsContainer"><div class="loading">加载中...</div></div></div>
        <div class="section"><div class="section-title">📋 最新帖子</div><div id="postsContainer"><div class="loading">加载中...</div></div></div>
        <div class="section"><div class="section-title">⚙️ 最近采集记录</div><div id="runsContainer"><div class="loading">加载中...</div></div></div>
        <div class="footer">
            <p>India Mobile Pulse © 2024-2026 | 数据每日 12:00 自动更新</p>
            <p style="margin-top:10px"><a href="https://huggingface.co/spaces/RobeaoBot/india-mobile-pulse" target="_blank" style="color:#667eea">🔗 HuggingFace Spaces</a> | <a href="https://github.com/RobeaoBot/india-mobile-pulse" target="_blank" style="color:#667eea">💻 GitHub</a></p>
        </div>
    </div>
    <script>
        const HF_URL = 'https://robeaobot-robeauobot.hf.space/api/dashboard';
        let countdown = 60;
        setInterval(() => { countdown--; document.getElementById('countdown').textContent = countdown; if(countdown <= 0) loadData(); }, 1000);
        function formatTime(ts) { if(!ts) return '--'; const d = new Date(ts), diff = (new Date()-d)/1000; if(diff<60) return '刚刚'; if(diff<3600) return Math.floor(diff/60)+'分钟前'; if(diff<86400) return Math.floor(diff/3600)+'小时前'; return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
        async function loadData() { try { const r = await fetch(HF_URL); if(!r.ok) throw new Error(); const data = await r.json(); renderDashboard(data); countdown = 60; } catch(e) { ['brandsContainer','postsContainer','runsContainer'].forEach(id => document.getElementById(id).innerHTML='<div class="error">❌ 数据加载失败，请稍后重试</div>'); } }
        function renderDashboard(data) { const s = data.stats||{}; document.getElementById('statTotal').textContent=s.total||0; document.getElementById('statToday').textContent=s.today||0; document.getElementById('statBrands').textContent=Object.keys(s.brand_mentions||{}).length; const sent=s.sentiment||{}, tot=(sent.positive||0)+(sent.negative||0)+(sent.neutral||0); if(tot>0){const pct=Math.round((sent.positive||0)/tot*100); document.getElementById('statSentiment').innerHTML='<span class="sentiment-'+(pct>=50?'positive':pct>=30?'neutral':'negative')+'">'+pct+'% 正面</span>';} renderBrands(s.brand_mentions||{}); renderPosts(data.recent_posts||[]); renderRuns(data.recent_runs||[]); }
        function renderBrands(m) { const c=document.getElementById('brandsContainer'); const e=Object.entries(m); if(!e.length){c.innerHTML='<div class="loading">暂无数据</div>';return;} const mx=Math.max(...e.map(x=>x[1])); c.innerHTML=e.map(([b,n])=>'<div class="brand-bar"><span class="brand-name">'+b+'</span><div class="brand-bar-bg"><div class="brand-bar-fill" style="width:'+Math.max(5,(n/mx)*100)+'%"></div></div><span class="brand-count">'+n+'</span></div>').join(''); }
        function renderPosts(p) { const c=document.getElementById('postsContainer'), l={reddit:'R',youtube:'YT',news:'N',official:'OFF'}; if(!p||!p.length){c.innerHTML='<div class="loading">暂无帖子</div>';return;} c.innerHTML=p.slice(0,20).map(x=>'<div class="post-item"><div class="post-title">'+escapeHtml(x.title)+'</div><div class="post-meta"><span class="source-badge source-'+x.source+'">'+l[x.source]+'</span><span class="sentiment-'+(x.sentiment||'neutral')+'">'+(x.sentiment==='positive'?'😊':x.sentiment==='negative'?'😟':'😐')+'</span><span>'+formatTime(x.published_at||x.collected_at)+'</span></div></div>').join(''); }
        function renderRuns(r) { const c=document.getElementById('runsContainer'); if(!r||!r.length){c.innerHTML='<div class="loading">暂无记录</div>';return;} c.innerHTML=r.slice(0,10).map(x=>'<div class="run-item"><span>'+x.source+'</span><span>'+(x.posts_count||0)+'条</span><span class="sentiment-'+(x.status==='success'?'positive':'negative')+'">'+(x.status==='success'?'✅ '+(x.new_posts||0)+'条':'❌')+'</span><span style="color:#a0a0a0">'+formatTime(x.started_at)+'</span></div>').join(''); }
        function escapeHtml(s) { if(!s)return''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
